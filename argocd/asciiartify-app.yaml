apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asciiartify
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vystepanenko/go-demo-app.git
    targetRevision: main
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: asciiartify
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
