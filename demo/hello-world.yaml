apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: hashicorp/http-echo:1.0.0
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - -listen=:5678
            - |-
              -text=
                   _             _ _    _         _   _  __
                  / \   ___  ___(_|_)  / \   _ __| |_(_)/ _|_   _
                 / _ \ / __|/ __| | | / _ \ | '__| __| | |_| | | |
                / ___ \\__ \ (__| | |/ ___ \| |  | |_| |  _| |_| |
               /_/   \_\___/\___|_|_/_/   \_\_|   \__|_|_|  \__, |
                                                            |___/
              Hello World from pod $(POD_NAME) on node $(NODE_NAME)
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
spec:
  type: NodePort
  selector:
    app: hello-world
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
